
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS AI</title>
<style>
body {
  background: #061426;
  color: #55dfff;
  font-family: Arial;
  text-align: center;
  padding: 25px;
}
h1 { letter-spacing: 8px; margin-top: 50px; }
#orb {
  width: 140px;
  height: 140px;
  border-radius: 50%;
  background: #13bdf5;
  box-shadow: 0 0 45px #13bdf5;
  margin: 40px auto;
  animation: glow 2s infinite alternate;
}
@keyframes glow {
  to { box-shadow: 0 0 75px #13bdf5; }
}
button {
  padding: 15px 22px;
  margin: 8px;
  border: 0;
  border-radius: 25px;
  background: #13bdf5;
  font-size: 16px;
}
input {
  padding: 14px;
  width: 85%;
  margin: 15px;
  border-radius: 10px;
}
#reply { color: white; margin: 25px; }
</style>
</head>
<body>
<h1>JARVIS</h1>
<p>YOUR PERSONAL AI ASSISTANT</p>
<div id="orb"></div>
<button onclick="listen()">🎤 TALK TO JARVIS</button>
<br>
<input id="msg" placeholder="Type your command">
<button onclick="run()">SEND</button>
<div id="reply">Hello! I am JARVIS. Ready to help you.</div>

<script>
function speak(text) {
 document.getElementById("reply").innerText = text;
 let voice = new SpeechSynthesisUtterance(text);
 speechSynthesis.speak(voice);
}
function run() {
 let c = document.getElementById("msg").value.toLowerCase();
 if(c.includes("hello")) speak("Hello! I am JARVIS.");
 else if(c.includes("time")) speak("The time is " + new Date().toLocaleTimeString());
 else if(c.includes("whatsapp")) {
 speak("Opening WhatsApp");
 window.open("https://www.whatsapp.com", "_blank");
 }
 else if(c.includes("youtube")) {
 speak("Opening YouTube");
 window.open("https://www.youtube.com", "_blank");
 }
 else if(c.includes("instagram")) {
 speak("Opening Instagram");
 window.open("https://www.instagram.com", "_blank");
 }
 else speak("I am listening. More AI features will be added soon.");
}
function listen() {
 let Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
 if(!Speech) { speak("Voice recognition is not supported in this browser."); return; }
 let r = new Speech();
 r.lang = "en-US";
 r.onresult = e => {
 document.getElementById("msg").value = e.results[0][0].transcript;
 run();
 };
 r.start();
}
</script>
</body>
</html>
